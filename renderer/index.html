<!doctype html>
<html lang="pt-BR" data-tema="taverna">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: arte:; media-src 'self' data: arte:; connect-src 'self' arte:">
  <title>Crônicas</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/telas.css">
  <link rel="stylesheet" href="css/jogo.css">
</head>
<body>
  <!-- palco: arte do lugar (crossfade) + tinta do tema + partículas + vinheta -->
  <div id="fundo-a" class="fundo"></div>
  <div id="fundo-b" class="fundo"></div>
  <div id="tinta"></div>
  <canvas id="particulas"></canvas>
  <div id="vinheta"></div>

  <header id="barra">
    <svg class="emblema" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 L56 11 V30 C56 45 45 55 32 61 C19 55 8 45 8 30 V11 Z" fill="#150d08" stroke="#c9a063" stroke-width="2"/>
      <path d="M32 9 L50 15 V30 C50 41 42 49 32 54 C22 49 14 41 14 30 V15 Z" style="fill: color-mix(in srgb, var(--acento) 75%, #300)"/>
      <path d="M32 17 L44 24 V38 L32 45 L20 38 V24 Z" fill="none" stroke="#ecd29a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M32 17 L32 26 M44 24 L38 36 M20 24 L26 36 M26 36 H38 M32 26 L26 36 M32 26 L38 36 M32 45 L26 36 M32 45 L38 36" stroke="#ecd29a" stroke-width="1.2" opacity=".75" fill="none"/>
    </svg>
    <div class="titulos"><div class="t1">Crônicas</div><div class="t2">RPG com Mestre IA</div></div>
    <div class="espaco"></div>
    <div class="extra"></div>
    <div class="ctl">
      <button data-min title="Minimizar"><svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button data-max title="Maximizar"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button data-fechar-janela class="fechar" title="Fechar"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </header>

  <div id="app"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
